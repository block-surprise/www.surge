<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SURGE</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571574988222927" crossorigin="anonymous"></script>
  <meta name="google-site-verification" content="QzpufK8Cl_B7crFUTFlAgQPzxa3RfE3NILhwN_26cwk" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #fdfdfd;
      --text: #333;
      --muted: #888;
      --border: #d9d9d9;
      --accent: #4da6ff;
      --shadow: rgba(0,0,0,0.06);
      /* 災害速報用の色 */
      --eq-bg: #fff5f5;
      --eq-border: #ff4d4d;
      --eq-text: #cc0000;
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    html, body { 
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", "Yu Gothic", "游ゴシック", "Meiryo", "メイリオ", sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 右上のバー */
    .topbar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      right: 16px;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      z-index: 10;
    }
    .ai-btn {
      padding: 12px;
      background: transparent;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      text-decoration: none;
    }
    .settings-btn {
      padding: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-btn i {
      font-size: 1.6rem;
      color: #000;
    }

    /* 中央コンテンツ */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15vh;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    h1 {
      margin: 0 0 .1rem;
      font-weight: 800;
      font-size: clamp(2.5rem, 10vw, 3.4rem);
      letter-spacing: .08em;
      color: #333;
    }
    .subtitle {
      margin: 0 0 2.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    /* 検索入力欄 */
    .search-container {
      width: 100%;
      max-width: 640px;
      position: relative;
      margin-bottom: 2rem;
    }
    #query {
      width: 100%;
      padding: 1rem 1.4rem;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 4px 16px var(--shadow);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    #query:focus {
      border-color: var(--accent);
    }

    /* 🚨 リアルタイム地震速報エリア（通常時は完全非表示） */
    .earthquake-panel {
      width: 100%;
      max-width: 640px;
      background: var(--eq-bg);
      border: 2px solid var(--eq-border);
      border-radius: 18px;
      padding: 1.2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(255, 77, 77, 0.1);
      display: none; /* JavaScriptの条件クリアでblockになる */
      cursor: pointer;
    }
    .eq-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      color: var(--eq-text);
      font-size: 1.1rem;
      margin-bottom: 0.6rem;
    }
    .eq-header i {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .eq-info {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.4;
      color: #333;
    }
    .eq-tsunami {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      font-weight: 700;
      background: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      display: inline-block;
      border: 1px solid #ffcccc;
      color: var(--eq-text);
    }

    /* ニュースセクション */
    .news-page {
      width: 100%;
      max-width: 720px;
      margin: 1rem auto 0;
      padding: 1rem 1rem 4rem;
    }
    .news-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .tab {
      border: 1px solid var(--border);
      background: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .news-card {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      text-decoration: none;
      color: var(--text);
      transition: 0.15s;
    }
    .news-card:active {
      transform: scale(0.98);
    }
    .news-content {
      flex: 1;
    }
    .news-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }
    .news-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* モーダル（下部シート風） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { padding: 2rem 1.5rem; }
    .list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    .app-item {
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .app-item span {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .app-icon-placeholder {
      width: 60px;
      height: 60px;
      background: #f8f9fa;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="https://surge.ad-hub.f5.si/ai/pro" class="ai-btn">SURGE PRO</a>
    <button class="settings-btn" id="openApps" aria-label="メニュー">
      <i class="fa-solid fa-grip"></i>
    </button>
  </div>

  <main class="center">
    <h1>SURGE</h1>
    <p class="subtitle">光のように、知をたどる。</p>
    
    <div class="search-container">
      <input id="query" type="text" placeholder="検索キーワードを入力…" inputmode="search" autocomplete="off" spellcheck="false"/>
    </div>

    <div id="earthquakePanel" class="earthquake-panel">
      <div class="eq-header">
        <i class="fa-solid fa-triangle-exclamation"></i> 緊急地震速報（24時間以内・震度3以上）
      </div>
      <div id="eqInfo" class="eq-info">データ確認中...</div>
      <div id="eqTsunami" class="eq-tsunami">詳細を確認中...</div>
    </div>

    <section class="news-page">
      <div class="news-tabs">
        <button class="tab active" data-q="latest">おすすめ</button>
        <button class="tab" data-q="soku">速報</button>
        <button class="tab" data-q="Japan news">日本</button>
        <button class="tab" data-q="technology">テクノロジー</button>
        <button class="tab" data-q="sports">スポーツ</button>
      </div>
      <div id="newsList" class="news-list"></div>
    </section>
    
    <script src="https://adm.shinobi.jp/s/f0100ea8f9ed13270dc07e21237f9e39"></script>
  </main>

  <div class="modal-backdrop" id="appsModal">
    <div class="modal">
      <div class="modal-header">
        <span style="font-weight:600; font-size: 1.1rem;">その他のアプリ</span>
        <button id="closeApps" style="border:none; background:none; cursor:pointer; font-size:1.5rem; color: var(--muted);">✕</button>
      </div>
      <div class="modal-body">
        <div class="list">
          <a class="app-item" href="/memo">
            <div class="app-icon-placeholder"><i class="fa-solid fa-pen-to-square"></i></div>
            <span>メモ</span>
          </a>
          <a class="app-item" href="/todo">
            <div class="app-icon-placeholder"><i class="fa-solid fa-check-double"></i></div>
            <span>やること</span>
          </a>
          <a class="app-item" href="/timer">
            <div class="app-icon-placeholder"><i class="fa-solid fa-stopwatch"></i></div>
            <span>タイマー</span>
          </a>
          <a class="app-item" href="https://surge.ad-hub.f5.si/dictionary">
            <div class="app-icon-placeholder"><i class="fa-solid fa-book"></i></div>
            <span>辞書</span>
          </a>
          <a class="app-item" href="/earthquake/detail">
            <div class="app-icon-placeholder"><i class="fa-solid fa-house-chimney-crack"></i></div>
            <span>地震情報</span>
          </a>
        </div>
        <script src="https://adm.shinobi.jp/s/f0100ea8f9ed13270dc07e21237f9e39"></script>
      </div>
    </div>
  </div>

  <script>
    const queryInput = document.getElementById("query");
    const appsModal = document.getElementById("appsModal");
    const openBtn = document.getElementById("openApps");
    const closeBtn = document.getElementById("closeApps");

    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const q = queryInput.value.trim();
        if (q) window.location.href = `/s/search?q=${encodeURIComponent(q)}`;
      }
    });

    openBtn.onclick = () => {
      appsModal.style.display = "flex";
      document.body.style.overflow = "hidden";
    };
    const closeModal = () => {
      appsModal.style.display = "none";
      document.body.style.overflow = "";
    };
    closeBtn.onclick = closeModal;
    window.onclick = (e) => { if (e.target === appsModal) closeModal(); };
  </script>

  <script>
    const earthquakePanel = document.getElementById("earthquakePanel");
    const eqInfo = document.getElementById("eqInfo");
    const eqTsunami = document.getElementById("eqTsunami");
    const newsList = document.getElementById("newsList");
    const tabs = document.querySelectorAll(".tab");

    const feeds = {
      latest: "https://www3.nhk.or.jp/rss/news/cat0.xml",
      soku: "https://www3.nhk.or.jp/rss/news/cat1.xml",
      japan: "https://www3.nhk.or.jp/rss/news/cat1.xml",
      tech: "https://www3.nhk.or.jp/rss/news/cat3.xml",
      sports: "https://www3.nhk.or.jp/rss/news/cat7.xml"
    };

    let currentKey = "latest";

        // 【1】 リアルタイム地震データ判別・表示ロジック（24時間以内で最大の地震を選出）
    async function fetchRealtimeEarthquake() {
      try {
        // 直近の震度速報を多めに15件取得して精査
        const res = await fetch("https://api.p2pquake.net/v2/history?codes=551&limit=15");
        const data = await res.json();
        
        if (!data || data.length === 0) {
          earthquakePanel.style.display = "none";
          return;
        }
        
        let targetEvent = null;
        let maxScaleFound = 0;
        const now = new Date();

        // 24時間以内で最も震度が大きいものを探す
        data.forEach(eq => {
          const scale = eq.earthquake.maxScale;
          if (scale < 30) return; // 震度3未満はスルー

          const eqDate = new Date(eq.earthquake.time.replace(/-/g, "/"));
          const hoursDiff = (now - eqDate) / (1000 * 60 * 60);

          if (hoursDiff > 24) return; // 24時間を超えていたらスルー

          if (scale > maxScaleFound) {
            maxScaleFound = scale;
            targetEvent = eq; 
          }
        });

        // 24時間以内に震度3以上の地震がなければ枠を隠して終了
        const panel = document.getElementById("earthquakePanel");
        if (!targetEvent) {
          panel.style.display = "none";
          return;
        }

        // --- 🟢 最大地震の描画処理 ---
        const maxScaleName = formatScale(targetEvent.earthquake.maxScale);
        const epicenter = targetEvent.earthquake.hypocenter.name || "調査中";
        const domesticTsunami = formatTsunami(targetEvent.earthquake.domesticTsunami);

        // 【🔥ここを修正！】アーカイブと同じように、IDと発生時間を完璧にセットして詳細ページへ送る
        panel.onclick = () => {
          window.location.href = `/earthquake/detail?id=${targetEvent._id}&time=${encodeURIComponent(targetEvent.earthquake.time)}`;
        };

        document.getElementById("eqInfo").innerHTML = `${targetEvent.earthquake.time}頃、<span style="color:var(--eq-text);">${epicenter}</span>で<span style="background:yellow; padding:0 4px;">過去24時間で最大</span>となる震度<span style="font-size:1.5rem; color:var(--eq-text); font-weight:900;"> ${maxScaleName} </span>の地震がありました。`;
        document.getElementById("eqTsunami").innerText = domesticTsunami + " (クリックで各地の震度を表示)";

        panel.style.display = "block";
      } catch (e) {
        console.error("地震速報の取得失敗:", e);
      }
    }



    function formatScale(code) {
      const scales = { 10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7" };
      return scales[code] || "不明";
    }

    function formatTsunami(type) {
      const tsunamiMap = {
        None: "🌊 この地震による津波の心配はありません。",
        Unknown: "🌊 津波の影響は不明です。",
        Checking: "🌊 津波の影響を調査中です。",
        NonEffective: "🌊 若干の海面変動がありますが被害の心配はありません。",
        Watch: "⚠️ 津波注意報が発表されています！",
        Warning: "🚨 津波警報が発表されています！避難してください！"
      };
      return tsunamiMap[type] || "🌊 津波情報に注意してください。";
    }

    // 【2】 NHKニュースの取得（キャッシュ対策付き）
    async function fetchNews(key) {
      newsList.innerHTML = "読み込み中...";
      try {
        const url = feeds[key] + "?_=" + new Date().getTime();

        const res = await fetch(url);
        const text = await res.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "text/xml");
        const items = xml.querySelectorAll("item");

        newsList.innerHTML = "";

        if (!items.length) {
          newsList.innerHTML = "現在、該当するニュースはありません。";
          return;
        }

        items.forEach((item, i) => {
          if (i > 10) return;

          const title = item.querySelector("title")?.textContent;
          const link = item.querySelector("link")?.textContent;
          const date = item.querySelector("pubDate")?.textContent;

          const a = document.createElement("a");
          a.href = link;
          a.target = "_blank";
          a.className = "news-card";

          a.innerHTML = `
            <div class="news-content">
              <div class="news-title">${title}</div>
              <div class="news-meta">${date ? new Date(date).toLocaleString("ja-JP") : ""}</div>
            </div>
          `;
          newsList.appendChild(a);
        });
      } catch (e) {
        console.error(e);
        newsList.innerHTML = "ニュース取得エラー（CORSまたは通信環境のエラー）";
      }
    }

    // タブイベントの割り当て
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        currentKey =
          tab.dataset.q === "latest" ? "latest" :
          tab.dataset.q === "soku" ? "soku" :
          tab.dataset.q === "Japan news" ? "japan" :
          tab.dataset.q === "technology" ? "tech" :
          "sports";

        fetchNews(currentKey);
      });
    });

    // 初期起動 & 自動更新タイマー
    fetchRealtimeEarthquake();
    setInterval(fetchRealtimeEarthquake, 60000); // 地震は1分毎チェック

    fetchNews(currentKey);
    setInterval(() => fetchNews(currentKey), 300000); // ニュースは5分毎チェック
  </script>
</body>
</html>
