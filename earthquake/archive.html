<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURGE - 地震履歴アーカイブ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #fdfdfd;
      --text: #333;
      --muted: #888;
      --border: #d9d9d9;
      --shadow: rgba(0,0,0,0.06);
      --accent: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", sans-serif; padding: 2rem 1rem 5rem;
    }
    .container { max-width: 640px; margin: 0 auto; }
    
    /* ヘッダー */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; border-bottom: 2px solid var(--text); padding-bottom: 0.8rem; }
    .back-btn { text-decoration: none; color: var(--text); font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }
    h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }

    /* リスト */
    .eq-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .eq-card {
      display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem;
      border-radius: 14px; background: #fff; border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow);
      text-decoration: none; color: inherit; transition: transform 0.1s;
    }
    .eq-card:active { transform: scale(0.98); }
    .eq-main-info { display: flex; flex-direction: column; gap: 0.3rem; }
    .eq-time { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .eq-place { font-weight: 700; font-size: 1rem; }
    .eq-badge { padding: 0.3rem 0.7rem; border-radius: 8px; color: #fff; font-size: 0.9rem; font-weight: 900; text-align: center; min-width: 75px; }

    /* 📄 ページネーション（UIデザイン） */
    .pagination {
      display: flex; justify-content: center; align-items: center; gap: 0.4rem; margin-top: 2.5rem; flex-wrap: wrap;
    }
    .page-btn {
      border: 1px solid var(--border); background: #fff; color: var(--text);
      min-width: 38px; height: 38px; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s;
    }
    .page-btn:hover { background: #f1f3f5; }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); pointer-events: none; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #f8f9fa; }

    .status-msg { text-align: center; padding: 3rem 1rem; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">
    <script src="https://adm.shinobi.jp/s/f0100ea8f9ed13270dc07e21237f9e39"></script>
    <div class="header">
      <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> 戻る</a>
      <h1><i class="fa-solid fa-database"></i> 地震履歴アーカイブ</h1>
    </div>

    <div id="archiveList" class="eq-list">
      <div class="status-msg">データを読み込み中...</div>
    </div>

    <div id="pagination" class="pagination"></div>
    <script src="https://adm.shinobi.jp/s/f0100ea8f9ed13270dc07e21237f9e39"></script>
  </div>

  <script>
    const archiveList = document.getElementById("archiveList");
    const paginationContainer = document.getElementById("pagination");
    
    const LIMIT = 50;  // 1ページあたりに表示する件数（50件くらいが見やすくておすすめ）
    let currentPage = 1; // 現在のページ番号

    // 指定されたページの地震データをAPIから取得する関数
    async function loadArchive(page) {
      window.scrollTo({ top: 0, behavior: 'smooth' }); // ページ切り替え時に上までスクロール
      archiveList.innerHTML = '<div class="status-msg">過去データを探索中...</div>';
      paginationContainer.innerHTML = '';

      // offset（スキップ件数）の計算。1ページ目は0、2ページ目は50件飛ばす、3ページ目は100件飛ばす…
      const offset = (page - 1) * LIMIT;

      try {
        // APIURLにlimitとoffsetを組み込んで過去へと遡る
        const res = await fetch(`https://api.p2pquake.net/v2/history?codes=551&limit=${LIMIT}&offset=${offset}`);
        const data = await res.json();
        
        if (!data || data.length === 0) {
          archiveList.innerHTML = '<div class="status-msg">これ以上過去の地震データはありません。</div>';
          renderPagination(false); // 次へ進めない状態でボタンを生成
          return;
        }

        renderList(data);
        renderPagination(data.length === LIMIT); // ぴったりLIMIT件取れたら「次のページもある」と判断

      } catch (e) {
        console.error(e);
        archiveList.innerHTML = '<div class="status-msg">データの取得に失敗しました。</div>';
      }
    }

    // リスト描画
    function renderList(data) {
      archiveList.innerHTML = "";

      data.forEach(eq => {
        const card = document.createElement("a");
        card.href = `/earthquake/detail?id=${eq._id}&time=${encodeURIComponent(eq.earthquake.time)}`;
        card.className = "eq-card";

        const time = eq.earthquake.time;
        const name = eq.earthquake.hypocenter.name || "震源情報なし";
        const scaleCode = eq.earthquake.maxScale;
        const scaleStr = formatScale(scaleCode);

        let badgeColor = "#6c757d";
        if (scaleCode >= 50) badgeColor = "#dc2626";
        else if (scaleCode >= 40) badgeColor = "#ef4444";
        else if (scaleCode >= 30) badgeColor = "#f59e0b";
        else if (scaleCode >= 20) badgeColor = "#3b82f6";

        card.innerHTML = `
          <div class="eq-main-info">
            <span class="eq-time">${time}</span>
            <span class="eq-place">${name}</span>
          </div>
          <span class="eq-badge" style="background: ${badgeColor};">震度 ${scaleStr}</span>
        `;
        archiveList.appendChild(card);
      });
    }

    // 📄 ページネーションボタンを動的に作る（100ページ以上対応版）
    function renderPagination(hasNextPage) {
      paginationContainer.innerHTML = "";

      // 【最初へ】ボタン（ページ数が多くなったときに超便利）
      if (currentPage > 3) {
        const firstBtn = document.createElement("button");
        firstBtn.className = "page-btn";
        firstBtn.innerHTML = '<i class="fa-solid fa-angles-left"></i>';
        firstBtn.onclick = () => { currentPage = 1; loadArchive(currentPage); };
        paginationContainer.appendChild(firstBtn);
      }

      // 【戻る】ボタン
      const prevBtn = document.createElement("button");
      prevBtn.className = "page-btn";
      prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
      prevBtn.disabled = (currentPage === 1);
      prevBtn.onclick = () => { currentPage--; loadArchive(currentPage); };
      paginationContainer.appendChild(prevBtn);

      // 【現在のページを中心にした前後5マスの数字ボタンを表示】
      let startPage = Math.max(1, currentPage - 2);
      let endPage = currentPage + 2;
      if (!hasNextPage) endPage = currentPage;

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement("button");
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.innerText = i;
        pageBtn.onclick = () => { currentPage = i; loadArchive(currentPage); };
        paginationContainer.appendChild(pageBtn);
      }

      // 【進む】ボタン
      const nextBtn = document.createElement("button");
      nextBtn.className = "page-btn";
      nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
      nextBtn.disabled = !hasNextPage;
      nextBtn.onclick = () => { currentPage++; loadArchive(currentPage); };
      paginationContainer.appendChild(nextBtn);
    }


    function formatScale(code) {
      return { 10:"1", 20:"2", 30:"3", 40:"4", 45:"5弱", 50:"5強", 55:"6弱", 60:"6強", 70:"7" }[code] || "不明";
    }

    // 初期読み込み（最初の1ページ目）
    loadArchive(currentPage);
  </script>
</body>
</html>
