<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。 | プレイ画面</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fcfaf8;
            --text-main: #333;
            --accent: #3498db;
        }

        body {
            margin: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        .stats {
            position: absolute; top: 20px;
            display: flex; gap: 40px;
            font-size: 1.2rem; font-weight: bold;
        }

        .game-canvas {
            width: 850px; height: 380px;
            background: white; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 1px solid #eee;
            margin-bottom: 30px;
        }

        #kanji-display { font-size: 4.5rem; margin-bottom: 20px; letter-spacing: 0.05em; }
        #roma-display { font-size: 2.2rem; color: #ccc; font-weight: bold; font-family: 'Courier New', monospace; min-height: 1.5em; }
        .char-done { color: var(--accent); }
        .char-current { border-bottom: 4px solid var(--primary-color); color: var(--text-main); }

        .ad-container { width: 100%; display: flex; justify-content: center; align-items: center; min-height: 100px; }

        .shake { animation: shake 0.2s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #result-screen {
            display: none; position: fixed; inset: 0;
            background: rgba(255,255,255,0.98);
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }
        .btn-retry {
            margin: 10px; padding: 15px 50px;
            background: var(--text-main); color: white;
            border-radius: 12px; font-size: 1.1rem;
            cursor: pointer; text-decoration: none; border: none;
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>のこり時間: <span id="timer">60</span>秒</div>
        <div>スコア: <span id="score">0</span></div>
    </div>

    <div class="game-canvas" id="canvas">
        <div id="kanji-display">準備はいい？</div>
        <div id="roma-display">Spaceキーでスタート</div>
    </div>

    <div class="ad-container">
        <script src="https://adm.shinobi.jp/s/3fca9fb2dfe3e7a1176425f21d3e9ab7"></script>
        </div>

    <div id="result-screen">
        <h2>結果発表</h2>
        <div style="font-size:6rem; font-weight:bold; margin-bottom: 20px;" id="final-score">0</div>
        <p>正解タイプ数</p>
        <a href="record.html" class="btn-retry">図鑑を見る</a>
        <button class="btn-retry" style="background: #eee; color: #333;" onclick="location.reload()">もう一度</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/roman-kana-typing@1.0.1/dist/bundle.js"></script>

    <script>
        // 指定された10単語に限定
        const wordList = [
            { k: "新千歳空港", y: "しんちとせくうこう" },
            { k: "文房具", y: "ぶんぼうぐ" },
            { k: "学校", y: "がっこう" },
            { k: "サージプロ", y: "さーじぷろ" },
            { k: "プログラミング", y: "ぷろぐらみんぐ" },
            { k: "飛行機", y: "ひこうき" },
            { k: "おにぎり", y: "おにぎり" },
            { k: "回転寿司", y: "かいてんずし" },
            { k: "最高速度", y: "さいこうそくど" },
            { k: "キーボード", y: "きーぼーど" }
        ];

        let score = 0, timeLeft = 60, isPlaying = false, timerId = null;
        let typingEngine = null, wordStartTime = 0, wordMissCount = 0;

        const kanjiEl = document.getElementById('kanji-display');
        const romaEl = document.getElementById('roma-display');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const canvasEl = document.getElementById('canvas');

        // キー入力管理
        window.addEventListener('keydown', e => {
            // ライブラリが読み込まれていない場合は何もしない
            if (typeof RomanKanaTyping === 'undefined') return;

            if (!isPlaying) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            // タイピング判定
            if (typingEngine.input(e.key)) {
                score++;
                scoreEl.textContent = score;
                if (typingEngine.isFinished()) {
                    const timeTaken = ((Date.now() - wordStartTime) / 1000).toFixed(2);
                    saveToLibrary(kanjiEl.textContent, timeTaken, wordMissCount);
                    nextWord();
                } else {
                    updateDisplay();
                }
            } else {
                if (e.key.length === 1 && e.key !== " ") {
                    wordMissCount++;
                    canvasEl.classList.add('shake');
                    setTimeout(() => canvasEl.classList.remove('shake'), 200);
                }
            }
        });

        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = 60;
            scoreEl.textContent = "0";
            nextWord(); // ここで最初の単語とエンジンを生成
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function nextWord() {
            const data = wordList[Math.floor(Math.random() * wordList.length)];
            kanjiEl.textContent = data.k;
            // エンジンを新しく作成（これで確実に初期化される）
            typingEngine = new RomanKanaTyping.Typing(data.y);
            wordStartTime = Date.now();
            wordMissCount = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const solved = typingEngine.getSolvedRoman();
            const pending = typingEngine.getPendingRoman();
            if (!pending) return;

            const current = pending.charAt(0);
            const rest = pending.slice(1);
            romaEl.innerHTML = `<span class="char-done">${solved}</span><span class="char-current">${current}</span><span>${rest}</span>`;
        }

        function saveToLibrary(word, time, miss) {
            let history = JSON.parse(localStorage.getItem('typing_records') || '{}');
            if (!history[word] || parseFloat(time) < parseFloat(history[word].time)) {
                history[word] = { time: time, miss: miss };
            }
            localStorage.setItem('typing_records', JSON.stringify(history));
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
        }
    </script>
</body>
</html>
