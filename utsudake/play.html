<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。 | プレイ画面</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fcfaf8;
            --text-main: #333;
            --accent: #3498db;
            --miss-color: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* 統計情報のヘッダー */
        .header-stats {
            position: absolute;
            top: 30px;
            display: flex;
            gap: 60px;
            background: white;
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
        }

        .stat-item span { color: var(--primary-color); font-size: 1.4rem; }

        /* ゲームメインキャンバス */
        .game-canvas {
            width: 900px;
            height: 420px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        /* コンボ表示 */
        #combo-display {
            position: absolute;
            right: 50px;
            top: 50px;
            font-size: 2rem;
            font-style: italic;
            color: var(--secondary-color);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #combo-display.show { opacity: 1; transform: scale(1.2); }

        #kanji-display {
            font-size: 5rem;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        #roma-display {
            font-size: 2.5rem;
            color: #ddd;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            min-height: 1.5em;
            letter-spacing: 0.05em;
        }

        /* タイピング中の文字色 */
        .char-done { color: var(--accent); }
        .char-current { 
            border-bottom: 5px solid var(--primary-color);
            color: var(--text-main);
            position: relative;
        }

        /* 広告コンテナ */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            min-height: 100px;
        }

        /* ミス時の演出 */
        .shake { animation: shake 0.25s; border: 2px solid var(--miss-color) !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        /* リザルト画面 */
        #result-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .result-card {
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
        }

        .result-score { font-size: 7rem; color: var(--primary-color); font-weight: 900; line-height: 1; }
        
        .btn-group { display: flex; gap: 20px; margin-top: 40px; }

        .btn {
            padding: 18px 45px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
        }

        .btn-main { background: var(--text-main); color: white; }
        .btn-sub { background: #eee; color: #333; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }

    </style>
</head>
<body>

    <div class="header-stats">
        <div class="stat-item">TIME: <span id="timer">60</span>s</div>
        <div class="stat-item">SCORE: <span id="score">0</span></div>
        <div class="stat-item">MISS: <span id="miss-total">0</span></div>
    </div>

    <div class="game-canvas" id="canvas">
        <div id="combo-display">0 COMBO!</div>
        <div id="kanji-display">準備はいい？</div>
        <div id="roma-display">Spaceキーでスタート</div>
    </div>

    <div class="ad-container">
        <script src="https://adm.shinobi.jp/s/3fca9fb2dfe3e7a1176425f21d3e9ab7"></script>
        </div>

    <div id="result-screen">
        <div class="result-card">
            <h2>Game Clear!</h2>
            <div class="result-score" id="final-score">0</div>
            <p style="color:#999; margin-bottom:30px;">TOTAL TYPES</p>
            <div class="btn-group">
                <a href="record.html" class="btn btn-main">図鑑を見る</a>
                <button class="btn btn-sub" onclick="location.reload()">もう一度</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/roman-kana-typing@1.0.1/dist/bundle.js"></script>

    <script>
        // 指定された10単語
        const wordList = [
            { k: "新千歳空港", y: "しんちとせくうこう" },
            { k: "文房具", y: "ぶんぼうぐ" },
            { k: "学校", y: "がっこう" },
            { k: "サージプロ", y: "さーじぷろ" },
            { k: "プログラミング", y: "ぷろぐらみんぐ" },
            { k: "飛行機", y: "ひこうき" },
            { k: "おにぎり", y: "おにぎり" },
            { k: "回転寿司", y: "かいてんずし" },
            { k: "最高速度", y: "さいこうそくど" },
            { k: "キーボード", y: "きーぼーど" }
        ];

        let score = 0, totalMiss = 0, combo = 0, timeLeft = 60;
        let isPlaying = false, timerId = null;
        let typingEngine = null, wordStartTime = 0, wordMissCount = 0;

        const kanjiEl = document.getElementById('kanji-display');
        const romaEl = document.getElementById('roma-display');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const missEl = document.getElementById('miss-total');
        const canvasEl = document.getElementById('canvas');
        const comboEl = document.getElementById('combo-display');

        // メイン入力ループ
        window.addEventListener('keydown', e => {
            if (typeof RomanKanaTyping === 'undefined') return;

            // 開始判定
            if (!isPlaying) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            // タイピング判定
            const isCorrect = typingEngine.input(e.key);

            if (isCorrect) {
                handleCorrectInput();
            } else {
                handleIncorrectInput(e.key);
            }
        });

        function startGame() {
            isPlaying = true;
            score = 0; totalMiss = 0; combo = 0; timeLeft = 60;
            scoreEl.textContent = "0";
            missEl.textContent = "0";
            nextWord();
            
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function handleCorrectInput() {
            score++;
            combo++;
            scoreEl.textContent = score;
            
            // コンボ演出
            if (combo >= 5) {
                comboEl.textContent = `${combo} COMBO!`;
                comboEl.classList.add('show');
            }

            if (typingEngine.isFinished()) {
                const timeTaken = ((Date.now() - wordStartTime) / 1000).toFixed(2);
                saveToLibrary(kanjiEl.textContent, timeTaken, wordMissCount);
                nextWord();
            } else {
                updateDisplay();
            }
        }

        function handleIncorrectInput(key) {
            if (key.length !== 1 || key === " ") return;

            totalMiss++;
            wordMissCount++;
            combo = 0;
            missEl.textContent = totalMiss;
            
            // コンボリセット演出
            comboEl.classList.remove('show');

            // ミス演出
            canvasEl.classList.add('shake');
            setTimeout(() => canvasEl.classList.remove('shake'), 250);
        }

        function nextWord() {
            const data = wordList[Math.floor(Math.random() * wordList.length)];
            kanjiEl.textContent = data.k;
            typingEngine = new RomanKanaTyping.Typing(data.y);
            wordStartTime = Date.now();
            wordMissCount = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const solved = typingEngine.getSolvedRoman();
            const pending = typingEngine.getPendingRoman();
            if (!pending) return;

            const current = pending.charAt(0);
            const rest = pending.slice(1);
            romaEl.innerHTML = `<span class="char-done">${solved}</span><span class="char-current">${current}</span><span>${rest}</span>`;
        }

        function saveToLibrary(word, time, miss) {
            let history = JSON.parse(localStorage.getItem('typing_records') || '{}');
            if (!history[word] || parseFloat(time) < parseFloat(history[word].time)) {
                history[word] = { time: time, miss: miss };
            }
            localStorage.setItem('typing_records', JSON.stringify(history));
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
        }
    </script>
</body>
</html>
