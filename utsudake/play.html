<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。 | プレイ画面</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fefdfb;
            --text-main: #2c3e50;
            --accent: #3498db;
        }

        body {
            margin: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* 統計情報 */
        .stats {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #timer { color: var(--primary-color); }

        /* ゲームキャンバス */
        .game-canvas {
            width: 850px;
            height: 380px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid #f0f0f0;
        }

        #kanji-display {
            font-size: 4.5rem;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        #roma-display {
            font-size: 2.2rem;
            color: #bdc3c7;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        .char-done { color: var(--accent); }
        .char-current { 
            border-bottom: 4px solid var(--primary-color);
            color: var(--text-main);
        }

        /* 演出 */
        .shake { animation: shake 0.2s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #result-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .result-score { font-size: 6rem; color: var(--primary-color); font-weight: bold; }
        .btn-retry {
            margin-top: 40px;
            padding: 18px 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>のこり時間: <span id="timer">60</span>秒</div>
        <div>合計タイプ: <span id="score">0</span></div>
    </div>

    <div class="game-canvas" id="canvas">
        <div id="kanji-display">準備はいい？</div>
        <div id="roma-display">Spaceキーでスタート</div>
    </div>

    <div id="result-screen">
        <h2>結果発表</h2>
        <div class="result-score" id="final-score">0</div>
        <p>正解タイプ数</p>
        <button class="btn-retry" onclick="location.href='record.html'">図鑑を見に行く</button>
        <button class="btn-retry" style="background: #95a5a6;" onclick="location.reload()">もう一度</button>
    </div>

    <script src="https://unpkg.com/roman-kana-typing@1.0.1/dist/bundle.js"></script>

    <script>
        const wordList = [
            { k: "新千歳空港", y: "しんちとせくうこう" },
            { k: "文房具", y: "ぶんぼうぐ" },
            { k: "学校", y: "がっこう" },
            { k: "サージプロ", y: "さーじぷろ" },
            { k: "プログラミング", y: "ぷろぐらみんぐ" },
            { k: "回転寿司", y: "かいてんずし" },
            { k: "飛行機", y: "ひこうき" },
            { k: "YouTube", y: "ゆーちゅーぶ" },
            { k: "開発者", y: "かいはつしゃ" },
            { k: "最高速度", y: "さいこうそくど" }
        ];

        let score = 0;
        let timeLeft = 60;
        let isPlaying = false;
        let timerId = null;
        let currentTyping = null;
        
        // 単語ごとの計測用
        let wordStartTime = 0;
        let wordMissCount = 0;

        const kanjiEl = document.getElementById('kanji-display');
        const romaEl = document.getElementById('roma-display');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const canvasEl = document.getElementById('canvas');

        // スペースキーで開始する処理を確実に
        window.addEventListener('keydown', e => {
            if (!isPlaying && e.code === 'Space') {
                e.preventDefault(); // スクロール防止
                startGame();
            }
        });

        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = 60;
            scoreEl.textContent = score;
            nextWord();
            if(timerId) clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) endGame();
        }

        function nextWord() {
            const data = wordList[Math.floor(Math.random() * wordList.length)];
            kanjiEl.textContent = data.k;
            currentTyping = new RomanKanaTyping.Typing(data.y);
            
            // 計測リセット
            wordStartTime = Date.now();
            wordMissCount = 0;
            
            updateDisplay();
        }

        function updateDisplay() {
            const solved = currentTyping.getSolvedRoman();
            const pending = currentTyping.getPendingRoman();
            romaEl.innerHTML = `<span class="char-done">${solved}</span><span class="char-current">${pending.charAt(0)}</span><span>${pending.slice(1)}</span>`;
        }

        // 図鑑にデータを保存する
        function saveToLibrary(word, time, miss) {
            let history = JSON.parse(localStorage.getItem('typing_records') || '{}');
            if (!history[word] || time < history[word].time) {
                history[word] = { time: time, miss: miss };
            }
            localStorage.setItem('typing_records', JSON.stringify(history));
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) return;
            if (e.key === 'Escape') return; // Escなどは無視

            if (currentTyping.input(e.key)) {
                score++;
                scoreEl.textContent = score;
                if (currentTyping.isFinished()) {
                    // 単語完成時のタイム計算
                    const timeTaken = ((Date.now() - wordStartTime) / 1000).toFixed(2);
                    saveToLibrary(kanjiEl.textContent, timeTaken, wordMissCount);
                    nextWord();
                } else {
                    updateDisplay();
                }
            } else {
                if (!["Shift", "Control", "Alt", "Meta"].includes(e.key)) {
                    wordMissCount++;
                    canvasEl.classList.add('shake');
                    setTimeout(() => canvasEl.classList.remove('shake'), 200);
                }
            }
        });
    </script>
</body>
</html>
