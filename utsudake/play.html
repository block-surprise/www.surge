<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。 | プレイ画面</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #feca57;
            --bg-color: #f7f1e3;
            --text-main: #2d3436;
            --accent: #48dbfb;
        }

        body {
            margin: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        .stats {
            position: absolute; top: 20px;
            display: flex; gap: 40px;
            font-size: 1.2rem; font-weight: bold;
        }

        .game-canvas {
            width: 850px; height: 380px;
            background: white; border-radius: 40px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 4px solid var(--text-main);
        }

        #kanji-display { font-size: 4.5rem; margin-bottom: 20px; }
        #roma-display { font-size: 2.2rem; color: #ccc; font-weight: bold; font-family: monospace; }
        .char-done { color: var(--accent); }
        .char-current { border-bottom: 4px solid var(--primary-color); color: var(--text-main); }

        .shake { animation: shake 0.2s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #result-screen {
            display: none; position: fixed; inset: 0;
            background: rgba(255,255,255,0.98);
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
        }
        .btn-retry {
            margin: 10px; padding: 18px 60px;
            background: var(--primary-color); color: white;
            border: 3px solid var(--text-main); border-radius: 50px;
            font-size: 1.3rem; cursor: pointer; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>のこり時間: <span id="timer">60</span>秒</div>
        <div>スコア: <span id="score">0</span></div>
    </div>

    <div class="game-canvas" id="canvas">
        <div id="kanji-display">準備はいい？</div>
        <div id="roma-display">Spaceキーでスタート</div>
    </div>

    <div id="result-screen">
        <h2>結果発表</h2>
        <div style="font-size:6rem; color:var(--primary-color); font-weight:bold;" id="final-score">0</div>
        <a href="record.html" class="btn-retry">図鑑を見る</a>
        <button class="btn-retry" style="background: #ccc;" onclick="location.reload()">もう一度</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/roman-kana-typing@1.0.1/dist/bundle.js"></script>

    <script>
        const wordList = [
            { k: "学校", y: "gakkou" },
            { k: "新千歳空港", y: "shinchitosekuukou" },
            { k: "文房具", y: "bunbougu" },
            { k: "サージプロ", y: "sa-jipuro" },
            { k: "プログラミング", y: "puroguramingu" },
            { k: "回転寿司", y: "kaitenzushi" },
            { k: "飛行機", y: "hikouki" },
            { k: "YouTube", y: "yu-tyu-bu" },
            { k: "最高速度", y: "saikousokudo" }
        ];

        let score = 0, timeLeft = 60, isPlaying = false, timerId = null;
        let typingEngine = null, wordStartTime = 0, wordMissCount = 0;

        const kanjiEl = document.getElementById('kanji-display');
        const romaEl = document.getElementById('roma-display');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const canvasEl = document.getElementById('canvas');

        window.addEventListener('keydown', e => {
            if (!isPlaying) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            // タイピング判定（ライブラリを使用し、入力ミスを柔軟に判定）
            if (typingEngine.input(e.key)) {
                score++;
                scoreEl.textContent = score;
                if (typingEngine.isFinished()) {
                    const timeTaken = ((Date.now() - wordStartTime) / 1000).toFixed(2);
                    saveToLibrary(kanjiEl.textContent, timeTaken, wordMissCount);
                    nextWord();
                } else {
                    updateDisplay();
                }
            } else {
                if (e.key.length === 1 && e.key !== " ") {
                    wordMissCount++;
                    canvasEl.classList.add('shake');
                    setTimeout(() => canvasEl.classList.remove('shake'), 200);
                }
            }
        });

        function startGame() {
            isPlaying = true; score = 0; timeLeft = 60;
            scoreEl.textContent = "0";
            nextWord();
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function nextWord() {
            const data = wordList[Math.floor(Math.random() * wordList.length)];
            kanjiEl.textContent = data.k;
            // ここでライブラリのエンジンを初期化！
            typingEngine = new RomanKanaTyping.Typing(data.y);
            wordStartTime = Date.now();
            wordMissCount = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const solved = typingEngine.getSolvedRoman();
            const pending = typingEngine.getPendingRoman();
            const current = pending.charAt(0);
            const rest = pending.slice(1);
            romaEl.innerHTML = `<span class="char-done">${solved}</span><span class="char-current">${current}</span><span>${rest}</span>`;
        }

        function saveToLibrary(word, time, miss) {
            let history = JSON.parse(localStorage.getItem('typing_records') || '{}');
            if (!history[word] || parseFloat(time) < parseFloat(history[word].time)) {
                history[word] = { time: time, miss: miss };
            }
            localStorage.setItem('typing_records', JSON.stringify(history));
        }

        function endGame() {
            isPlaying = false; clearInterval(timerId);
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
        }
    </script>
</body>
</html>
