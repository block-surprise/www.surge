<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。 | 完全版</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fefdfb;
            --text-main: #2c3e50;
            --accent: #3498db;
        }

        body {
            margin: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* ヘッダー情報 */
        .stats {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #timer { color: var(--primary-color); }

        /* ゲームエリア */
        .game-canvas {
            width: 850px;
            height: 350px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid #f0f0f0;
        }

        #kanji-display {
            font-size: 4.5rem;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        #roma-display {
            font-size: 2.2rem;
            color: #bdc3c7;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .char-done { color: var(--accent); }
        .char-current { 
            border-bottom: 4px solid var(--primary-color);
            color: var(--text-main);
        }

        /* 演出アニメーション */
        .shake { animation: shake 0.2s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        #result-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .result-score { font-size: 6rem; color: var(--primary-color); font-weight: bold; }
        
        .btn-retry {
            margin-top: 40px;
            padding: 18px 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 126, 95, 0.3);
        }
    </style>
</head>
<body>

    <div class="stats">
        <div>のこり時間: <span id="timer">60</span>秒</div>
        <div>スコア: <span id="score">0</span></div>
    </div>

    <div class="game-canvas" id="canvas">
        <div id="kanji-display">準備はいい？</div>
        <div id="roma-display">Spaceキーでスタート</div>
    </div>

    <div id="result-screen">
        <h2>結果発表</h2>
        <div class="result-score" id="final-score">0</div>
        <p>正解タイプ数</p>
        <button class="btn-retry" onclick="location.reload()">もう一度挑戦する</button>
    </div>

    <script src="https://unpkg.com/roman-kana-typing@1.0.1/dist/bundle.js"></script>

    <script>
        // 大量の単語データ
        const wordList = [
            { k: "新千歳空港", y: "しんちとせくうこう" },
            { k: "文房具", y: "ぶんぼうぐ" },
            { k: "学校", y: "がっこう" },
            { k: "サージプロ", y: "さーじぷろ" },
            { k: "プログラミング", y: "ぷろぐらみんぐ" },
            { k: "飛行機", y: "ひこうき" },
            { k: "おにぎり", y: "おにぎり" },
            { k: "回転寿司", y: "かいてんずし" },
            { k: "最高速度", y: "さいこうそくど" },
            { k: "キーボード", y: "きーぼーど" },
            { k: "YouTube", y: "ゆーちゅーぶ" },
            { k: "ウェブサイト", y: "うぇぶさいと" },
            { k: "中学生", y: "ちゅうがくせい" },
            { k: "滑走路", y: "かっそうろ" },
            { k: "夏休み", y: "なつやすみ" },
            { k: "青空", y: "あおぞら" },
            { k: "お茶漬け", y: "おちゃづけ" },
            { k: "開発者", y: "かいはつしゃ" },
            { k: "深呼吸", y: "しんこきゅう" },
            { k: "流れ星", y: "ながれぼし" }
        ];

        let score = 0;
        let timeLeft = 60;
        let isPlaying = false;
        let timerId = null;
        let currentTyping = null; // ローマ字判定エンジン

        const kanjiEl = document.getElementById('kanji-display');
        const romaEl = document.getElementById('roma-display');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const canvasEl = document.getElementById('canvas');

        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = 60;
            nextWord();
            timerId = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) endGame();
        }

        function nextWord() {
            const data = wordList[Math.floor(Math.random() * wordList.length)];
            kanjiEl.textContent = data.k;
            // ライブラリを使用して複数入力に対応した判定エンジンを生成
            currentTyping = new RomanKanaTyping.Typing(data.y);
            updateDisplay();
        }

        function updateDisplay() {
            // 正解済みの部分と、これからの部分を取得
            const solved = currentTyping.getSolvedRoman();
            const pending = currentTyping.getPendingRoman();
            
            // 画面表示を更新
            romaEl.innerHTML = `<span class="char-done">${solved}</span><span class="char-current">${pending.charAt(0)}</span><span>${pending.slice(1)}</span>`;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerId);
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
        }

        window.addEventListener('keydown', e => {
            if (!isPlaying) {
                if (e.code === 'Space') startGame();
                return;
            }

            // キー入力判定
            if (currentTyping.input(e.key)) {
                // 正解
                score++;
                scoreEl.textContent = score;
                if (currentTyping.isFinished()) {
                    nextWord();
                } else {
                    updateDisplay();
                }
            } else {
                // ミス
                if(e.key !== "Shift") { // Shiftキーでのミス判定を防ぐ
                    canvasEl.classList.add('shake');
                    setTimeout(() => canvasEl.classList.remove('shake'), 200);
                }
            }
        });
    </script>
</body>
</html>
