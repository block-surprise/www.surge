<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>打つだけ。 | 図鑑</title>
    <style>
        body {
            background-color: #fefdfb;
            font-family: "Hiragino Sans", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 { color: #2c3e50; margin-bottom: 40px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: white;
            border-radius: 20px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #eee;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .card.locked {
            background-color: #f0f0f0;
            color: #bdc3c7;
            font-size: 3rem;
            cursor: default;
        }
        .card.locked:hover { transform: none; }

        .card.unlocked {
            border-color: #feb47b;
        }

        .word-name { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .stats { font-size: 0.8rem; color: #7f8c8d; }

        .back-link { margin-bottom: 20px; text-decoration: none; color: #ff7e5f; font-weight: bold; }

        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        .analysis-kana {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin: 20px 0;
            word-break: break-all;
        }
        .miss-highlight {
            color: #e74c3c;
            border-bottom: 4px solid #e74c3c;
        }
        .analysis-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← ホームへもどる</a>
    <h1>タイピング図鑑</h1>
    
    <div class="grid" id="record-grid"></div>

    <div id="analysis-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">学校</h2>
            <div class="analysis-label">苦手分析（赤い文字がミスしがち）</div>
            <div id="modal-kana" class="analysis-kana"></div>
            <div id="modal-stats" class="stats"></div>
        </div>
    </div>

    <script>
        const allWords = [
            "新千歳空港", "文房具", "学校", "宝物", "プログラミング", "飛行機", 
            "おにぎり", "回転寿司", "最高速度", "キーボード", "カマキリ", "コンピューター", 
            "お知らせ", "留守番電話", "委員会", "入学式", "コンクリート", "ショートケーキ", 
            "片栗粉", "航空管制官", "滑走路", "ボーイング", "エアバス", "特別急行", 
            "北陸新幹線", "自動改札機", "展望デッキ", "マイル修行", "電子マネー", 
            "人工知能", "ソースコード", "データベース", "サーバー構築", "コマンドブロック", 
            "バグ修正", "検索エンジン", "アップデート", "仮想現実", "暗号化", 
            "修学旅行", "期末テスト", "放課後", "図書館", "夏休み", "文化祭", 
            "体育館", "お掃除当番", "給食の時間", "最高裁判所", "オムライス", 
            "メロンパン", "焼肉定食", "たこ焼き", "チョコレート", "虹色", 
            "星空", "冒険者", "不思議な箱", "未来都市"
        ];
        
        const history = JSON.parse(localStorage.getItem('typing_records') || '{}');
        const grid = document.getElementById('record-grid');
        const modal = document.getElementById('analysis-modal');

        allWords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (history[word]) {
                card.classList.add('unlocked');
                card.innerHTML = `
                    <div class="word-name">${word}</div>
                    <div class="stats">最速: ${history[word].time}秒</div>
                    <div class="stats">累計ミス: ${history[word].miss}回</div>
                `;
                card.onclick = () => showAnalysis(word);
            } else {
                card.classList.add('locked');
                card.textContent = '?';
            }
            grid.appendChild(card);
        });

        function showAnalysis(word) {
            const data = history[word];
            if (!data) return;

            document.getElementById('modal-title').textContent = word;
            
            // 読み（かな）を1文字ずつ分割して、ミスがある場所を赤くする
            const kana = data.kana || ""; 
            const missLocs = data.missLocations || {};
            let displayHtml = "";

            if (kana) {
                for (let char of kana) {
                    if (missLocs[char] && missLocs[char] > 0) {
                        displayHtml += `<span class="miss-highlight">${char}</span>`;
                    } else {
                        displayHtml += `<span>${char}</span>`;
                    }
                }
            } else {
                displayHtml = "記録データが足りません";
            }

            document.getElementById('modal-kana').innerHTML = displayHtml;
            document.getElementById('modal-stats').innerHTML = `最速タイム: ${data.time}秒 / 累計ミス: ${data.miss}回`;
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // モーダルの外側をクリックしても閉じる
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
