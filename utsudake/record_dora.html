<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>打つだけ。 | 図鑑</title>
    <style>
        body {
            background-color: #fefdfb;
            font-family: "Hiragino Sans", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 { color: #2c3e50; margin-bottom: 40px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: white;
            border-radius: 20px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #eee;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .card.locked {
            background-color: #f0f0f0;
            color: #bdc3c7;
            font-size: 3rem;
            cursor: default;
        }
        .card.locked:hover { transform: none; }

        .card.unlocked {
            border-color: #feb47b;
        }

        .word-name { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .stats { font-size: 0.8rem; color: #7f8c8d; }

        .back-link { margin-bottom: 20px; text-decoration: none; color: #ff7e5f; font-weight: bold; }

        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        .analysis-kana {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin: 20px 0;
            word-break: break-all;
        }
        .miss-highlight {
            color: #e74c3c;
            border-bottom: 4px solid #e74c3c;
        }
        .analysis-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← ホームへもどる</a>
    <h1>タイピング図鑑</h1>
    
    <div class="grid" id="record-grid"></div>

    <div id="analysis-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">学校</h2>
            <div class="analysis-label">苦手分析（赤い文字がミスしがち）</div>
            <div id="modal-kana" class="analysis-kana"></div>
            <div id="modal-stats" class="stats"></div>
        </div>
    </div>

    <script>
const allWords = [
    "ドラえもん", "野比のび太", "源静香", "剛田武", "骨川スネ夫", "ドラミ", "出木杉英才", "ジャイ子", "セワシ", "先生",
    "タケコプター", "どこでもドア", "タイムマシン", "スモールライト", "ビッグライト", "四次元ポケット", "暗記パン", "ほんやくコンニャク", "もしもボックス", "タイムふろしき",
    "通りぬけフープ", "着せかえカメラ", "空気砲", "ショックガン", "ころばし屋", "独裁スイッチ", "地球破壊爆弾", "名刀電光丸", "ひらりマント", "身代わりテレビ",
    "きこりの泉", "バイバイン", "正直太郎", "ウマタケ", "竹馬", "アベコンベ", "グルメテーブルかけ", "エースキャップ", "とりよせバッグ", "ころりろ窓",
    "きせかえカメラ", "桃太郎印のきびだんご", "コエカタマリン", "フエール銀行", "タイムテレビ", "タイムパトロール", "ミニドラ", "どら焼き", "ネズミ", "空き地",
    "神成さん", "土管", "タケコプター", "ピー助", "恐竜", "鉄人兵団", "魔界大冒険", "海底鬼岩城", "宇宙小戦争", "日本誕生",
    "アニマル惑星", "雲の王国", "夢幻三剣士", "銀河超特急", "創世日記", "南海大冒険", "宇宙漂流記", "太陽王伝説", "翼の勇者たち", "ロボット王国",
    "ふしぎ風使い", "ワンニャン時空伝", "新恐竜", "スタンドバイミー", "二十二世紀", "野比家", "松芝ロボット工場", "黄色いドラえもん", "青いタヌキ", "猫型ロボット",
    "おざしきつりぼり", "スモールライト", "空気ピストル", "透明マント", "石ころぼうし", "タヌキ", "ジャイアンのリサイタル", "きれいなジャイアン", "心の友", "剛田商店",
    "スネ夫の自慢", "ラジコン", "しずかちゃんのお風呂", "バイオリン", "焼き芋", "昼寝", "あやとり", "射撃", "のび太のくせに", "ドラ焼き大好き"
];
        
        const history = JSON.parse(localStorage.getItem('typing_records') || '{}');
        const grid = document.getElementById('record-grid');
        const modal = document.getElementById('analysis-modal');

        allWords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (history[word]) {
                card.classList.add('unlocked');
                card.innerHTML = `
                    <div class="word-name">${word}</div>
                    <div class="stats">最速: ${history[word].time}秒</div>
                    <div class="stats">累計ミス: ${history[word].miss}回</div>
                `;
                card.onclick = () => showAnalysis(word);
            } else {
                card.classList.add('locked');
                card.textContent = '?';
            }
            grid.appendChild(card);
        });

        function showAnalysis(word) {
            const data = history[word];
            if (!data) return;

            document.getElementById('modal-title').textContent = word;
            
            // 読み（かな）を1文字ずつ分割して、ミスがある場所を赤くする
            const kana = data.kana || ""; 
            const missLocs = data.missLocations || {};
            let displayHtml = "";

            if (kana) {
                for (let char of kana) {
                    if (missLocs[char] && missLocs[char] > 0) {
                        displayHtml += `<span class="miss-highlight">${char}</span>`;
                    } else {
                        displayHtml += `<span>${char}</span>`;
                    }
                }
            } else {
                displayHtml = "記録データが足りません";
            }

            document.getElementById('modal-kana').innerHTML = displayHtml;
            document.getElementById('modal-stats').innerHTML = `最速タイム: ${data.time}秒 / 累計ミス: ${data.miss}回`;
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // モーダルの外側をクリックしても閉じる
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
