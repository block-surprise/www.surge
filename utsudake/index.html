<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571574988222927"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-3571574988222927">
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fcfaf8;
            --text-main: #333;
            --card-bg: #ffffff;
            --menu-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0; padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        /* ハンバーガーメニュー */
        .menu-trigger {
            position: fixed; top: 25px; left: 25px; width: 40px; height: 40px;
            cursor: pointer; z-index: 1000; display: flex; flex-direction: column;
            justify-content: space-around; padding: 5px;
        }
        .menu-trigger span {
            display: block; width: 100%; height: 3px; background: var(--text-main);
            border-radius: 2px; transition: all 0.3s;
        }
        .menu-trigger.open span:nth-child(1) { transform: translateY(11px) rotate(45deg); }
        .menu-trigger.open span:nth-child(2) { opacity: 0; }
        .menu-trigger.open span:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

        .side-menu {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: var(--menu-bg); box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            z-index: 999; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 100px 20px 20px; display: flex; flex-direction: column; gap: 5px;
        }
        .side-menu.open { left: 0; }
        .side-menu h3 { font-size: 0.8rem; color: #bbb; margin: 20px 0 10px 15px; letter-spacing: 0.1em; }

        .side-menu-item {
            padding: 15px 20px; text-decoration: none; color: var(--text-main);
            border-radius: 12px; font-weight: 500; transition: 0.2s; cursor: pointer;
        }
        .side-menu-item:hover { background: #f0f0f0; padding-left: 30px; }
        .side-menu-item.active { background: #eee; color: var(--primary-color); }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.1);
            opacity: 0; visibility: hidden; transition: 0.3s; z-index: 998;
        }
        .overlay.show { opacity: 1; visibility: visible; }

        /* メインコンテンツ */
        .container {
            text-align: center; background: var(--card-bg); padding: 60px 80px;
            border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            max-width: 600px; width: 90%; position: relative;
        }

        h1 { font-size: 3rem; margin: 0; font-weight: 200; letter-spacing: 0.2em; transition: 0.3s; }
        #mode-title { font-weight: bold; color: var(--primary-color); display: block; font-size: 1.5rem; margin-top: 10px; }
        .subtitle { font-size: 0.9rem; color: #999; margin-bottom: 50px; }

        .menu-grid { display: flex; flex-direction: column; gap: 15px; }
        .menu-button {
            display: block; padding: 18px; text-decoration: none; border-radius: 15px;
            font-size: 1.1rem; font-weight: 500; transition: 0.3s; border: 1px solid #eee;
        }
        .btn-play { background: var(--text-main); color: white; border: none; }
        .btn-play:hover { background: #555; transform: translateY(-2px); }
        .btn-record { background: white; color: var(--text-main); }

        .footer { margin-top: 40px; font-size: 0.8rem; color: #ccc; }
    </style>
</head>
<body>

    <div class="menu-trigger" id="menu-trigger"><span></span><span></span><span></span></div>

    <div class="side-menu" id="side-menu">
        <h3>SELECT MODE</h3>
        <div class="side-menu-item active" onclick="changeMode('normal')">通常編</div>
        <div class="side-menu-item" onclick="changeMode('yoji')">四字熟語編</div>
        <div class="side-menu-item" onclick="changeMode('minecraft')">マイクラ編</div>
        <div class="side-menu-item" onclick="changeMode('airline')">航空・マイル編</div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="container">
        <h1>打つだけ。<span id="mode-title"></span></h1>
        <p class="subtitle" id="mode-subtitle">Just Typing.</p>

        <div class="menu-grid">
            <a href="play.html" id="start-button" class="menu-button btn-play">タイピングを始める</a>
            <a href="record.html" class="menu-button btn-record">図鑑・記録を確認</a>
        </div>

        <div class="footer">SURGE PRO</div>
    </div>

    <script>
        const trigger = document.getElementById('menu-trigger');
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('mode-title');
        const startBtn = document.getElementById('start-button');

        // モード設定データ
        const modes = {
            'normal': { title: '', file: 'index.html' },
            'yoji': { title: '〜四字熟語編〜', file: '/yoji/' },
            'minecraft': { title: '〜マイクラ編〜', file: 'minecraft.html' },
            'airline': { title: '〜航空・マイル編〜', file: 'airline.html' }
        };

        function toggleMenu() {
            trigger.classList.toggle('open');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        // モードを切り替える関数
        function changeMode(modeKey) {
            const mode = modes[modeKey];
            title.textContent = mode.title;
            startBtn.href = mode.file;

            // メニューの「active」クラスを付け替える
            document.querySelectorAll('.side-menu-item').forEach(item => {
                item.classList.remove('active');
                if(item.textContent.includes(modeKey === 'normal' ? '通常' : modeKey)) item.classList.add('active');
            });

            toggleMenu(); // 切り替えたらメニューを閉じる
        }

        trigger.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
