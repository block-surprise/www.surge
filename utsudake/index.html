<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fefdfb;
            --text-main: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景のふわふわした装飾 */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
            border-radius: 50%;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 60px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 0.2em;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin: 20px 0 40px;
        }

        /* メインメニューのボタン */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .menu-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-decoration: none;
            border-radius: 24px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        /* あそぶボタン */
        .btn-play {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 10px 25px rgba(255, 126, 95, 0.3);
        }

        /* きろくボタン */
        .btn-record {
            background: white;
            color: var(--text-main);
            border: 2px solid #eee;
        }

        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .btn-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="bg-blob"></div>

    <div class="container">
        <h1>打つだけ。</h1>
        <p class="subtitle">日々のタイピングに、心地よさを。</p>

        <div class="menu-grid">
            <a href="play.html" class="menu-button btn-play">
                <span class="icon">⌨️</span>
                <span class="btn-title">あそぶ</span>
            </a>
            <a href="record.html" class="menu-button btn-record">
                <span class="icon">📚</span>
                <span class="btn-title">きろく</span>
            </a>
        </div>
    </div>

    <div class="footer">
        Powered by SURGE PRO
    </div>

</body>
</html>
