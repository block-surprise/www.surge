<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3571574988222927"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-3571574988222927">
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fcfaf8;
            --text-main: #333;
            --card-bg: #ffffff;
            --menu-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- ハンバーガーメニューのスタイル --- */
        .menu-trigger {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
        }
        .menu-trigger span {
            display: block;
            width: 100%;
            height: 3px;
            background: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s;
        }

        /* サイドメニュー本体 */
        .side-menu {
            position: fixed;
            top: 0;
            left: -300px; /* 最初は隠しておく */
            width: 280px;
            height: 100%;
            background: var(--menu-bg);
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
            z-index: 999;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 100px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .side-menu.open {
            left: 0;
        }

        .side-menu h3 {
            font-size: 0.8rem;
            color: #bbb;
            margin-left: 15px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .side-menu-item {
            padding: 15px 20px;
            text-decoration: none;
            color: var(--text-main);
            border-radius: 12px;
            font-weight: 500;
            transition: 0.2s;
        }
        .side-menu-item:hover {
            background: #f0f0f0;
            padding-left: 30px;
        }

        /* メニューが開いている時のオーバーレイ */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 998;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* アイコンのアニメーション（開いたとき×にする） */
        .menu-trigger.open span:nth-child(1) { transform: translateY(11px) rotate(45deg); }
        .menu-trigger.open span:nth-child(2) { opacity: 0; }
        .menu-trigger.open span:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

        /* --- メインコンテンツのスタイル --- */
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 200;
            letter-spacing: 0.3em;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 50px;
            letter-spacing: 0.1em;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-button {
            display: block;
            padding: 18px;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }

        .btn-play {
            background: var(--text-main);
            color: white;
            border: none;
        }
        .btn-play:hover {
            background: #555;
            transform: translateY(-2px);
        }

        .btn-record {
            background: white;
            color: var(--text-main);
        }
        .btn-record:hover {
            background: #f9f9f9;
            border-color: #ddd;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="menu-trigger" id="menu-trigger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="side-menu" id="side-menu">
        <h3>Mode Selection</h3>
        <a href="play.html" class="side-menu-item">通常編</a>
        <a href="yoji.html" class="side-menu-item">四字熟語編</a>
        <a href="minecraft.html" class="side-menu-item">マイクラ編</a>
        <a href="airline.html" class="side-menu-item">航空・マイル編</a>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="container">
        <h1>打つだけ。</h1>
        <p class="subtitle">Just Typing.</p>

        <div class="menu-grid">
            <a href="play.html" class="menu-button btn-play">タイピングを始める</a>
            <a href="record.html" class="menu-button btn-record">図鑑・記録を確認</a>
        </div>

        <div class="footer">
            SURGE PRO
        </div>
    </div>

    <script>
        const trigger = document.getElementById('menu-trigger');
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');

        // メニューの開閉
        function toggleMenu() {
            trigger.classList.toggle('open');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        trigger.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
