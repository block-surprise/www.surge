<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。</title>
    <style>
        :root {
            --primary-color: #ff6b6b;   /* ポップなレッドピンク */
            --secondary-color: #feca57; /* 元気なイエロー */
            --accent-color: #48dbfb;    /* さわやかなブルー */
            --bg-color: #f7f1e3;        /* 温かみのあるベージュ */
            --text-main: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ポップな浮遊する円 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.6;
            animation: float 6s infinite ease-in-out;
        }
        .b1 { width: 100px; height: 100px; background: var(--primary-color); top: 10%; left: 15%; }
        .b2 { width: 150px; height: 150px; background: var(--secondary-color); bottom: 15%; right: 10%; animation-delay: 2s; }
        .b3 { width: 80px; height: 80px; background: var(--accent-color); top: 60%; left: 5%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 50px; /* 超角丸 */
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05); /* 影をベタ塗りっぽくしてポップに */
            border: 4px solid var(--text-main); /* 太めのフチ */
            max-width: 500px;
            width: 90%;
            transform: rotate(-1deg); /* わずかに傾けて遊び心を */
        }

        h1 {
            font-size: 4.5rem;
            margin: 0;
            color: var(--text-main);
            text-shadow: 4px 4px 0px var(--secondary-color);
            -webkit-text-stroke: 2px var(--text-main);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: #636e72;
            margin: 20px 0 40px;
            background: #eee;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
        }

        /* メニューボタン */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            transform: rotate(1deg); /* コンテナと逆方向に傾けてバランスをとる */
        }

        .menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-decoration: none;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            transition: all 0.2s;
            border: 3px solid var(--text-main);
            position: relative;
            overflow: hidden;
        }

        /* あそぶボタン（赤） */
        .btn-play {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 8px 0px #b33939;
        }

        /* きろくボタン（青） */
        .btn-record {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 8px 0px #22a6b3;
        }

        .menu-button:hover {
            transform: translateY(4px);
            box-shadow: 0 4px 0px var(--text-main);
        }

        .menu-button:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        .icon {
            margin-right: 15px;
            font-size: 2rem;
        }

        .footer {
            margin-top: 40px;
            font-weight: bold;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="container">
        <h1>打つだけ。</h1>
        <p class="subtitle">TYPE OR DIE!</p>

        <div class="menu-grid">
            <a href="play.html" class="menu-button btn-play">
                <span class="icon">🎮</span> START
            </a>
            <a href="record.html" class="menu-button btn-record">
                <span class="icon">🏆</span> RECORDS
            </a>
        </div>
    </div>

    <div class="footer">
        © 2026 SURGE PRO
    </div>

</body>
</html>
