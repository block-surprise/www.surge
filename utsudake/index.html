<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打つだけ。</title>
    <style>
        :root {
            --primary-color: #ff7e5f;
            --secondary-color: #feb47b;
            --bg-color: #fcfaf8;
            --text-main: #333;
            --card-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 200; /* 細身のフォントで洗練さを */
            letter-spacing: 0.3em;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 50px;
            letter-spacing: 0.1em;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-button {
            display: block;
            padding: 18px;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }

        /* あそぶボタン */
        .btn-play {
            background: var(--text-main);
            color: white;
            border: none;
        }
        .btn-play:hover {
            background: #555;
            transform: translateY(-2px);
        }

        /* きろくボタン */
        .btn-record {
            background: white;
            color: var(--text-main);
        }
        .btn-record:hover {
            background: #f9f9f9;
            border-color: #ddd;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>打つだけ。</h1>
        <p class="subtitle">Just Typing.</p>

        <div class="menu-grid">
            <a href="play.html" class="menu-button btn-play">タイピングを始める</a>
            <a href="record.html" class="menu-button btn-record">図鑑・記録を確認</a>
        </div>

        <div class="footer">
            Developed by Kikara / SURGE PRO
        </div>
    </div>

</body>
</html>
