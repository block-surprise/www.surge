<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>打つだけ。 | 難読漢字図鑑</title>
    <style>
        body {
            background-color: #fefdfb;
            font-family: "Hiragino Sans", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 { color: #2c3e50; margin-bottom: 40px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: white;
            border-radius: 20px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #eee;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .card.locked {
            background-color: #f0f0f0;
            color: #bdc3c7;
            font-size: 3rem;
            cursor: default;
        }
        .card.locked:hover { transform: none; }

        .card.unlocked {
            border-color: #feb47b;
        }

        .word-name { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .stats { font-size: 0.8rem; color: #7f8c8d; }

        .back-link { margin-bottom: 20px; text-decoration: none; color: #ff7e5f; font-weight: bold; }

        /* モーダルのスタイル */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        .analysis-kana {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin: 20px 0;
            word-break: break-all;
        }
        .miss-highlight {
            color: #e74c3c;
            border-bottom: 4px solid #e74c3c;
        }
        .analysis-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← ホームへもどる</a>
    <h1>タイピング図鑑</h1>
    
    <div class="grid" id="record-grid"></div>

    <div id="analysis-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">学校</h2>
            <div class="analysis-label">苦手分析（赤い文字がミスしがち）</div>
            <div id="modal-kana" class="analysis-kana"></div>
            <div id="modal-stats" class="stats"></div>
        </div>
    </div>

    <script>
const allWords = [
    "薔薇", "憂鬱", "醤油", "檸檬", "麒麟", "向日葵", "翡翠", "瑞典", "葡萄", "林檎",
    "微塵切り", "情緒", "雰囲気", "五月蠅い", "欠伸", "海戦", "海老", "烏賊", "章魚", "玉蜀黍",
    "案山子", "紫陽花", "菖蒲", "杜若", "蒲公英", "百合", "秋桜", "仙人掌", "胡桃", "無花果",
    "心太", "羊羹", "外郎", "饅頭", "煎餅", "団栗", "蝸牛", "蜻蛉", "蟷螂", "天道虫",
    "蜘蛛", "蜜蜂", "蝉", "蛍", "揚羽蝶", "蝙蝠", "梟", "鸚鵡", "鴉", "雀",
    "燕", "鴎", "鴨", "雉", "鶏", "眼鏡", "万年筆", "背広", "鞄", "靴下",
    "足袋", "炬燵", "暖簾", "蚊帳", "箒", "塵取", "抽斗", "匙", "箸", "石鹸",
    "玩具", "独楽", "紙魚", "金魚", "刺身", "寿司", "天麩羅", "味噌", "納豆", "豆腐",
    "小豆", "大豆", "隠元豆", "豌豆", "蚕豆", "飛魚", "秋刀魚", "鰯", "鯖", "鰹",
    "鮪", "鮭", "鱈", "鰻", "鯛", "鰈", "鮃", "鰤", "鮎", "鯉"
];
        
        const history = JSON.parse(localStorage.getItem('typing_records') || '{}');
        const grid = document.getElementById('record-grid');
        const modal = document.getElementById('analysis-modal');

        allWords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (history[word]) {
                card.classList.add('unlocked');
                card.innerHTML = `
                    <div class="word-name">${word}</div>
                    <div class="stats">最速: ${history[word].time}秒</div>
                    <div class="stats">累計ミス: ${history[word].miss}回</div>
                `;
                card.onclick = () => showAnalysis(word);
            } else {
                card.classList.add('locked');
                card.textContent = '?';
            }
            grid.appendChild(card);
        });

        function showAnalysis(word) {
            const data = history[word];
            if (!data) return;

            document.getElementById('modal-title').textContent = word;
            
            // 読み（かな）を1文字ずつ分割して、ミスがある場所を赤くする
            const kana = data.kana || ""; 
            const missLocs = data.missLocations || {};
            let displayHtml = "";

            if (kana) {
                for (let char of kana) {
                    if (missLocs[char] && missLocs[char] > 0) {
                        displayHtml += `<span class="miss-highlight">${char}</span>`;
                    } else {
                        displayHtml += `<span>${char}</span>`;
                    }
                }
            } else {
                displayHtml = "記録データが足りません";
            }

            document.getElementById('modal-kana').innerHTML = displayHtml;
            document.getElementById('modal-stats').innerHTML = `最速タイム: ${data.time}秒 / 累計ミス: ${data.miss}回`;
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // モーダルの外側をクリックしても閉じる
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
